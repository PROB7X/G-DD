<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Онлайн Шахматы</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #121214;
      --panel-bg: #1e1e24;
      --text-color: #ffffff;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --light-sq: #ebecd0;
      --dark-sq: #739552;
      --highlight: rgba(255, 255, 51, 0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; user-select: none; }

    /* Зеленая вспышка при вашем ходе */
    #turn-flash {
      position: fixed; inset: 0; pointer-events: none; z-index: 900;
      box-shadow: inset 0 0 80px rgba(34, 197, 94, 0.75);
      background: rgba(34, 197, 94, 0.12);
      opacity: 0; transition: opacity 0.3s ease;
    }
    #turn-flash.active { opacity: 1; }

    /* Полноэкранный режим и подтверждение выхода */
    .overlay {
      position: fixed; inset: 0; background: rgba(18, 18, 20, 0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px; text-align: center;
    }
    .overlay.hidden { display: none; }
    
    #close-fs {
      position: absolute; top: 20px; right: 20px; background: transparent; border: none;
      color: #888; cursor: pointer; padding: 8px;
    }

    /* Маленькая кнопка выхода сверху слева */
    #top-leave-btn {
      position: fixed; top: 14px; left: 14px; z-index: 800;
      background: var(--panel-bg); border: 1px solid #333; color: #ccc;
      width: 38px; height: 38px; border-radius: 8px;
      display: none; align-items: center; justify-content: center;
      cursor: pointer; touch-action: manipulation;
    }
    #top-leave-btn:active { background: #2c2c35; color: #fff; }

    .btn {
      background: var(--accent); color: #fff; border: none; padding: 14px 24px;
      font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer;
      margin-top: 12px; width: 100%; touch-action: manipulation;
    }
    .btn:active { background: var(--accent-hover); }
    .btn-secondary { background: #2c2c35; }
    .btn-danger { background: var(--danger); }

    .card {
      background: var(--panel-bg); padding: 24px; border-radius: 12px;
      text-align: center; width: 90%; max-width: 360px; display: none; flex-direction: column;
    }
    .card.active { display: flex; }

    input {
      width: 100%; padding: 12px; margin-top: 14px; border-radius: 8px; border: 1px solid #333;
      background: #121214; color: #fff; font-size: 16px; text-align: center;
    }

    .loader {
      width: 40px; height: 40px; border: 4px solid #333; border-top-color: var(--accent);
      border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #game-container { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 460px; padding: 12px; }
    #status-bar { width: 100%; text-align: center; padding: 6px 12px; font-size: 16px; font-weight: 600; color: #60a5fa; margin-bottom: 6px; border-radius: 6px; transition: 0.2s; }
    #status-bar.check-alert { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.5); }

    .player-bar {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; padding: 6px 4px; min-height: 34px;
    }
    .player-name { font-size: 15px; font-weight: 600; color: #eee; }
    .captured-list { display: flex; align-items: center; flex-wrap: wrap; gap: 1px; }
    .captured-list svg { width: 18px; height: 18px; }
    .score-badge { font-size: 12px; font-weight: 700; color: #aaa; margin-left: 5px; }

    #board-wrapper { position: relative; width: 100%; aspect-ratio: 1 / 1; }
    #board {
      display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
      width: 100%; height: 100%; border: 4px solid var(--panel-bg); border-radius: 6px; overflow: hidden;
    }
    .square {
      width: 100%; height: 100%; aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      position: relative; cursor: pointer; touch-action: manipulation;
    }
    .square.light { background: var(--light-sq); }
    .square.dark { background: var(--dark-sq); }
    .square.selected { background: var(--highlight); }
    .square.last-move { background: rgba(205, 210, 106, 0.65); }
    .square.in-check {
      background: radial-gradient(circle, #ff2a2a 25%, #b91c1c 95%) !important;
      animation: pulseCheck 1s infinite alternate;
    }
    @keyframes pulseCheck { from { filter: brightness(1); } to { filter: brightness(1.3); } }

    .square.valid-move::after {
      content: ''; width: 28%; height: 28%; background: rgba(0, 0, 0, 0.25); border-radius: 50%; position: absolute;
    }
    .square svg { width: 82%; height: 82%; display: block; pointer-events: none; z-index: 2; }

    /* Слой для плавного скольжения фигуры */
    #anim-layer { position: absolute; inset: 4px; pointer-events: none; z-index: 50; }
    .anim-piece {
      position: absolute; width: 12.5%; height: 12.5%;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .anim-piece svg { width: 82%; height: 82%; }
    
    .controls { margin-top: 12px; display: flex; gap: 10px; width: 100%; }
  </style>
</head>
<body>

  <!-- Вспышка при ходе игрока -->
  <div id="turn-flash"></div>

  <!-- Маленькая SVG-кнопка выхода сверху слева -->
  <button id="top-leave-btn" onclick="openLeaveConfirm()" aria-label="Выйти из матча">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
  </button>

  <!-- Модальное окно подтверждения выхода -->
  <div id="leave-modal" class="overlay hidden">
    <div class="card active" style="max-width: 310px;">
      <h3 style="margin-bottom: 8px;">Покинуть партию?</h3>
      <p style="color: #aaa; font-size: 14px;">Если вы выйдете сейчас, вам будет засчитано поражение.</p>
      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button onclick="closeLeaveConfirm()" class="btn btn-secondary" style="margin-top:0;">Остаться</button>
        <button onclick="confirmLeaveGame()" class="btn btn-danger" style="margin-top:0;">Выйти</button>
      </div>
    </div>
  </div>

  <!-- Полноэкранный режим -->
  <div id="fs-overlay" class="overlay">
    <button id="close-fs" onclick="declineFullscreen()" aria-label="Закрыть">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <h2 style="margin-bottom: 8px;">Полноэкранный режим</h2>
    <p style="color: #aaa; max-width: 300px; font-size: 14px;">Разверните игру на весь экран для удобного управления.</p>
    <button id="enter-fs" onclick="enterFullscreen()" class="btn" style="width: auto;">На весь экран</button>
  </div>

  <!-- Главное меню -->
  <div id="lobby" class="card active">
    <h2>Онлайн Шахматы</h2>
    <input type="text" id="nick-input" placeholder="Введите ваш ник" maxlength="16">
    <button onclick="startMatchmaking()" class="btn">Играть онлайн</button>
    <button onclick="startBotGame()" class="btn btn-secondary">Играть с ботом</button>
  </div>

  <!-- Экран поиска соперника -->
  <div id="search-screen" class="card">
    <h2>Поиск соперника</h2>
    <div class="loader"></div>
    <p style="color: #aaa; font-size: 14px;">Ожидаем второго игрока...</p>
    <button onclick="cancelMatchmaking()" class="btn btn-danger">Отменить поиск</button>
  </div>

  <!-- Игровой экран -->
  <div id="game-container">
    <div id="status-bar">Ход белых</div>
    <div class="player-bar">
      <span id="top-player" class="player-name">Соперник</span>
      <div id="top-captured" class="captured-list"></div>
    </div>
    <div id="board-wrapper">
      <div id="board"></div>
      <div id="anim-layer"></div>
    </div>
    <div class="player-bar">
      <span id="bottom-player" class="player-name">Вы</span>
      <div id="bottom-captured" class="captured-list"></div>
    </div>
    <div class="controls">
      <button id="restart-bot-btn" onclick="startBotGame()" class="btn btn-secondary" style="display:none; margin-top:0;">Начать заново</button>
    </div>
  </div>
  <script type="module">

    let fsDeclined = false;
    window.enterFullscreen = function() {
      fsDeclined = false;
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      document.getElementById('fs-overlay').classList.add('hidden');
    };

    window.declineFullscreen = function() {
      fsDeclined = true;
      document.getElementById('fs-overlay').classList.add('hidden');
    };

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && !fsDeclined) {
        document.getElementById('fs-overlay').classList.remove('hidden');
      }
    });

    const socket = io();
    let game = new Chess();
    let gameMode = null;
    let playerColor = 'w';
    let currentRoom = null;
    let myNickname = 'Игрок';
    let selectedSquare = null;
    let lastMove = null;
    let gameEnded = false;
    let isAnimating = false;

    const lobby = document.getElementById('lobby');
    const searchScreen = document.getElementById('search-screen');
    const gameContainer = document.getElementById('game-container');
    const boardEl = document.getElementById('board');
    const animLayer = document.getElementById('anim-layer');
    const statusBar = document.getElementById('status-bar');
    const topPlayer = document.getElementById('top-player');
    const bottomPlayer = document.getElementById('bottom-player');
    const topCaptured = document.getElementById('top-captured');
    const bottomCaptured = document.getElementById('bottom-captured');
    const topLeaveBtn = document.getElementById('top-leave-btn');
    const leaveModal = document.getElementById('leave-modal');
    const turnFlash = document.getElementById('turn-flash');
    const restartBotBtn = document.getElementById('restart-bot-btn');

    function showScreen(screen) {
      lobby.classList.remove('active');
      searchScreen.classList.remove('active');
      gameContainer.style.display = 'none';
      topLeaveBtn.style.display = 'none';

      if (screen === 'lobby') lobby.classList.add('active');
      if (screen === 'search') searchScreen.classList.add('active');
      if (screen === 'game') {
        gameContainer.style.display = 'flex';
        topLeaveBtn.style.display = 'flex';
      }
    }

    function triggerTurnFlash() {
      turnFlash.classList.add('active');
      setTimeout(() => turnFlash.classList.remove('active'), 950);
    }

    window.openLeaveConfirm = () => leaveModal.classList.remove('hidden');
    window.closeLeaveConfirm = () => leaveModal.classList.add('hidden');
    window.confirmLeaveGame = () => {
      closeLeaveConfirm();
      if (gameMode === 'online' && currentRoom) socket.emit('leaveMatch', currentRoom);
      currentRoom = null;
      gameMode = null;
      selectedSquare = null;
      lastMove = null;
      showScreen('lobby');
    };

    window.startMatchmaking = function() {
      myNickname = document.getElementById('nick-input').value.trim() || 'Игрок';
      showScreen('search');
      socket.emit('findMatch', { nickname: myNickname });
    };

    window.cancelMatchmaking = function() {
      socket.emit('cancelSearch');
      showScreen('lobby');
    };

    window.startBotGame = function() {
      myNickname = document.getElementById('nick-input').value.trim() || 'Игрок';
      gameMode = 'bot';
      playerColor = 'w';
      currentRoom = null;
      gameEnded = false;
      selectedSquare = null;
      lastMove = null;
      game.reset();

      bottomPlayer.textContent = myNickname;
      topPlayer.textContent = 'Бот (ИИ)';
      restartBotBtn.style.display = 'block';

      showScreen('game');
      updateStatus();
      updateCapturedUI();
      renderBoard();
      triggerTurnFlash();
    };

    socket.on('matchFound', ({ roomId, color, players, fen }) => {
      gameMode = 'online';
      currentRoom = roomId;
      playerColor = color;
      gameEnded = false;
      selectedSquare = null;
      lastMove = null;
      game.load(fen);

      restartBotBtn.style.display = 'none';
      if (color === 'b') {
        bottomPlayer.textContent = players.b.name;
        topPlayer.textContent = players.w.name;
      } else {
        bottomPlayer.textContent = players.w.name;
        topPlayer.textContent = players.b.name;
      }

      showScreen('game');
      updateStatus();
      updateCapturedUI();
      renderBoard();
      if (playerColor === 'w') triggerTurnFlash();
    });

    socket.on('moveMade', ({ fen }) => {
      if (gameMode !== 'online') return;
      const oldBoard = game.board();
      const tempGame = new Chess(fen);
      const newBoard = tempGame.board();
      
      let fromSq = null, toSq = null, movedPiece = null;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = String.fromCharCode(97 + c) + (8 - r);
          if (oldBoard[r][c] && !newBoard[r][c]) {
            fromSq = sq;
            movedPiece = oldBoard[r][c];
          } else if (newBoard[r][c] && (!oldBoard[r][c] || oldBoard[r][c].color !== newBoard[r][c].color)) {
            toSq = sq;
          }
        }
      }

      if (fromSq && toSq && movedPiece && movedPiece.color !== playerColor) {
        animateMove(fromSq, toSq, movedPiece, () => {
          game.load(fen);
          lastMove = { from: fromSq, to: toSq };
          selectedSquare = null;
          updateStatus();
          updateCapturedUI();
          renderBoard();
          if (!game.isGameOver()) triggerTurnFlash();
        });
      } else {
        game.load(fen);
        selectedSquare = null;
        updateStatus();
        updateCapturedUI();
        renderBoard();
      }
    });

    socket.on('opponentLeft', () => {
      if (gameMode === 'online' && !gameEnded) {
        gameEnded = true;
        statusBar.classList.remove('check-alert');
        statusBar.textContent = 'Соперник покинул игру. Вы победили!';
      }
    });
    function animateMove(from, to, piece, callback) {
      isAnimating = true;
      const isFlipped = playerColor === 'b';
      const getCoords = (sq) => {
        const col = sq.charCodeAt(0) - 97;
        const row = 8 - parseInt(sq);
        return {
          x: (isFlipped ? 7 - col : col) * 100,
          y: (isFlipped ? 7 - row : row) * 100
        };
      };

      const start = getCoords(from);
      const end = getCoords(to);
      const fromEl = document.querySelector(`[data-sq="${from}"] svg`);
      if (fromEl) fromEl.style.opacity = '0';

      const flyer = document.createElement('div');
      flyer.className = 'anim-piece';
      flyer.innerHTML = SVGS[piece.color + piece.type.toUpperCase()];
      flyer.style.transform = `translate(${start.x}%, ${start.y}%)`;
      animLayer.appendChild(flyer);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          flyer.style.transform = `translate(${end.x}%, ${end.y}%)`;
        });
      });

      setTimeout(() => {
        animLayer.innerHTML = '';
        isAnimating = false;
        callback();
      }, 250);
    }

    function updateCapturedUI() {
      const initial = { p: 8, n: 2, b: 2, r: 2, q: 1 };
      const current = { w: { p: 0, n: 0, b: 0, r: 0, q: 0 }, b: { p: 0, n: 0, b: 0, r: 0, q: 0 } };
      const values = { p: 1, n: 3, b: 3, r: 5, q: 9 };

      for (const row of game.board()) {
        for (const cell of row) {
          if (cell && cell.type !== 'k') current[cell.color][cell.type]++;
        }
      }

      const wCaptured = [];
      const bCaptured = [];
      let wScore = 0, bScore = 0;

      for (const type of ['q', 'r', 'b', 'n', 'p']) {
        const lostBlack = Math.max(0, initial[type] - current.b[type]);
        for (let i = 0; i < lostBlack; i++) { wCaptured.push('b' + type.toUpperCase()); wScore += values[type]; }

        const lostWhite = Math.max(0, initial[type] - current.w[type]);
        for (let i = 0; i < lostWhite; i++) { bCaptured.push('w' + type.toUpperCase()); bScore += values[type]; }
      }

      const renderList = (el, list, diff) => {
        el.innerHTML = list.map(k => SVGS[k]).join('') + (diff > 0 ? `<span class="score-badge">+${diff}</span>` : '');
      };

      if (playerColor === 'b') {
        renderList(bottomCaptured, bCaptured, bScore - wScore);
        renderList(topCaptured, wCaptured, wScore - bScore);
      } else {
        renderList(bottomCaptured, wCaptured, wScore - bScore);
        renderList(topCaptured, bCaptured, bScore - wScore);
      }
    }

    function makeBotMove() {
      if (gameMode !== 'bot' || game.isGameOver() || gameEnded) return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      const pieceValues = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
      let bestMoves = [], maxScore = -1;

      for (const m of moves) {
        let score = m.captured ? pieceValues[m.captured] : 0;
        if (score > maxScore) { maxScore = score; bestMoves = [m]; }
        else if (score === maxScore) bestMoves.push(m);
      }

      const chosen = bestMoves[Math.floor(Math.random() * bestMoves.length)];
      const pieceObj = game.get(chosen.from);

      animateMove(chosen.from, chosen.to, pieceObj, () => {
        game.move(chosen);
        lastMove = { from: chosen.from, to: chosen.to };
        updateStatus();
        updateCapturedUI();
        renderBoard();
        if (!game.isGameOver()) triggerTurnFlash();
      });
    }

    function updateStatus() {
      statusBar.classList.remove('check-alert');
      if (game.isCheckmate()) {
        gameEnded = true;
        const winner = game.turn() === 'w' ? 'Черные' : 'Белые';
        statusBar.textContent = `Мат! Победили ${winner}`;
      } else if (game.isDraw()) {
        gameEnded = true;
        statusBar.textContent = 'Ничья';
      } else {
        const turnName = game.turn() === 'w' ? 'Ход белых' : 'Ход черных';
        if (game.isCheck()) {
          statusBar.classList.add('check-alert');
          statusBar.textContent = `ШАХ! ${turnName}`;
        } else {
          statusBar.textContent = turnName;
        }
      }
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      const board = game.board();
      const isFlipped = playerColor === 'b';
      const validMoves = selectedSquare ? game.moves({ square: selectedSquare, verbose: true }).map(m => m.to) : [];
      const inCheck = game.isCheck();
      const turnColor = game.turn();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const row = isFlipped ? 7 - r : r;
          const col = isFlipped ? 7 - c : c;
          const squareName = String.fromCharCode(97 + col) + (8 - row);
          const piece = board[row][col];

          const sqEl = document.createElement('div');
          sqEl.dataset.sq = squareName;
          sqEl.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
          
          if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) sqEl.classList.add('last-move');
          if (selectedSquare === squareName) sqEl.classList.add('selected');
          if (validMoves.includes(squareName)) sqEl.classList.add('valid-move');
          if (inCheck && piece && piece.type === 'k' && piece.color === turnColor) sqEl.classList.add('in-check');

          if (piece) {
            const key = piece.color + piece.type.toUpperCase();
            sqEl.innerHTML = SVGS[key] || '';
          }

          sqEl.addEventListener('click', () => handleSquareClick(squareName));
          boardEl.appendChild(sqEl);
        }
      }
    }

    function handleSquareClick(square) {
      if (isAnimating || game.isGameOver() || gameEnded || game.turn() !== playerColor) return;

      if (selectedSquare) {
        try {
          const moveObj = { from: selectedSquare, to: square, promotion: 'q' };
          const pieceObj = game.get(selectedSquare);
          const moveAttempt = game.move(moveObj);

          if (moveAttempt) {
            game.undo();
            const fromSq = selectedSquare;
            selectedSquare = null;

            animateMove(fromSq, square, pieceObj, () => {
              game.move(moveObj);
              lastMove = { from: fromSq, to: square };
              updateStatus();
              updateCapturedUI();
              renderBoard();

              if (gameMode === 'online') {
                socket.emit('makeMove', { roomId: currentRoom, move: moveObj });
              } else {
                setTimeout(makeBotMove, 350);
              }
            });
            return;
          }
        } catch (e) {}
      }

      const piece = game.get(square);
      if (piece && piece.color === playerColor) {
        selectedSquare = (selectedSquare === square) ? null : square;
      } else {
        selectedSquare = null;
      }
      renderBoard();
    }
  </script>
</body>
